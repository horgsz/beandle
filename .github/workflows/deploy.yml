name: Deploy Beandle

# Builds the site with the current puzzle and deploys it to GitHub Pages.
# The new bean goes live at exactly 12:00 (noon) Sydney time. Builds in the 3 hours
# before noon also ship the next puzzle (locked until noon), and the page switches to
# it on the dot, so a late or dropped run doesn't delay the new bean.
#
# Cron is UTC-only and runs can be late, so we run several times (avoiding :00):
#   23:07 23:37 00:07 00:37 01:07 01:37 UTC = 10:07–12:37 AEDT / 09:07–11:37 AEST (preload)
#   02:41 03:41 UTC = afternoon clean-up builds (drop the preloaded copy once it's live)
# Every run is stateless: the same puzzle day always gives the same puzzle id.

on:
  schedule:
    - cron: "7,37 23,0,1 * * *"
    - cron: "41 2,3 * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Build site
        env:
          BEANDLE_WORDS: ${{ secrets.BEANDLE_WORDS }}
          BEANDLE_SEED: ${{ secrets.BEANDLE_SEED }}
          BEANDLE_OVERRIDE: ${{ secrets.BEANDLE_OVERRIDE }}
          BEANDLE_FACTS: ${{ secrets.BEANDLE_FACTS }}
        run: node scripts/build-site.mjs

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
