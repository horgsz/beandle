name: Deploy Beandle

# Builds the site with the current puzzle and deploys it to GitHub Pages.
# The new bean goes live at exactly 12:00 (noon) Sydney time. Every build also ships the
# next puzzle (locked until noon), and the page switches to it on the dot, so any one
# successful run in the day before noon is enough — a late or dropped run doesn't matter.
#
# Cron is UTC-only and best-effort (runs can be late or skipped), so run every 3 hours,
# avoiding :00. "41 */3" UTC = 11:41am, 2:41pm, 5:41pm … AEDT (10:41am, 1:41pm … AEST).
# Every run is stateless: the same puzzle day always gives the same puzzle id.

on:
  schedule:
    - cron: "41 */3 * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Build site
        env:
          BEANDLE_WORDS: ${{ secrets.BEANDLE_WORDS }}
          BEANDLE_SEED: ${{ secrets.BEANDLE_SEED }}
          BEANDLE_OVERRIDE: ${{ secrets.BEANDLE_OVERRIDE }}
          BEANDLE_FACTS: ${{ secrets.BEANDLE_FACTS }}
        run: node scripts/build-site.mjs

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
